[workspace]
members = [
    "cycle-engine/gateway",
    "cycle-engine/pipeline",
    "cycle-engine/transport",
    "cycle-engine/engine",
    "cycle-engine/persistence",
    "cycle-engine/infra",
    "cycle-engine/flows",
    "additional-services/os-utils",
    "data-engine/cold-storage",
    "data-engine/cold-starter",
    "execution-engine",
    "risk-engine",
    "strategies-engine",
    "services-engine/ohlcv-engine",
    "services-engine/calc-ind",
    "services-engine/stream-ohlcv",
    "services-engine/trade-ohlcv",
    "services-engine/detect-ms",
    "services-engine/paper-service",
    "services-engine/alert-service",
    "services-engine/exec-console",
    "services-engine/db-query",
    "services-engine/telegram-bot",
    "services-engine/force-orders",
]
exclude = ["tests", "unused_services"]
resolver = "2"

# ── Tek kaynak: tüm üyeler buradaki sürümleri kullanır (sürüm kayması yok) ──
[workspace.dependencies]
rust_decimal = { version = "1.34", features = ["maths", "serde"] }
ndarray      = { version = "0.15", features = ["rayon"] }
rayon        = "1.8"
wide         = "0.7"

terminal_size = "0.4"
figlet-rs     = "0.1"
ferro_ta_core = { version = "1.2", features = ["serde"] }

tokio        = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
axum         = "0.8"
axum-server  = { version = "0.8", features = ["tls-rustls"] }
reqwest      = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking"] }
flume        = "0.11"
parking_lot  = "0.12"
clap         = { version = "4.6", features = ["derive", "env"] }
chrono       = "0.4"
rusqlite     = { version = "0.31.0", features = ["bundled"] }
libc         = "0.2"
memmap2      = "0.9"
core_affinity = "0.8"
crossbeam    = "0.8"
crossbeam-channel = "0.5"
hdrhistogram = "7.6"
simd-json    = "0.13"
dotenvy      = "0.15"
sha3         = "0.10"
rustyline    = "14"
uuid         = { version = "1.6", features = ["v4", "serde"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower        = "0.5"
tower-http   = { version = "0.6", features = ["cors", "trace"] }
jsonwebtoken = "9"
argon2       = "0.5"
rand         = "0.8"
sled         = "0.34"
toml         = "0.8"
rtrb         = "0.3"
redis        = { version = "0.27", features = ["tokio-comp"] }
async-trait  = "0.1"
flate2       = "1.0"
sqlx         = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal"] }

# Test araçları
proptest     = "1.0"
