[workspace]
members = [
    "core",
    "adapter",
    "risk-worker",
    "cold-starter",
    "cold-storage",
    "os-utils", "execution-engine", "ohlcv-engine", "detect-sr", "detect-trend", "detect-ms", "detect-liquidity", "detect-pattern",
    "paper-service",
]
resolver = "2"

[workspace.dependencies]
rust_decimal = { version = "1.34", features = ["maths", "serde"] }
