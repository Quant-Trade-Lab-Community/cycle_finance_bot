[package]
name = "heiusdt"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rusqlite = { version = "0.31.0", features = ["bundled"] }
