[package]
name = "core"
version = "0.1.0"
edition = "2021"

[features]
default = ["binance_v5"]
binance_v5 = []
binance_v6 = []

[dependencies]
tokio = { version = "1.0", features = ["full"] }
flume = "0.11"
parking_lot = "0.12"
simd-json = "0.13"
futures-util = "0.3"
cold-storage = { path = "../cold-storage" }
adapter = { path = "../adapter" }
os-utils = { path = "../os-utils" }
sha3 = "0.10"
rusqlite = { version = "0.31.0", features = ["bundled"] }

[dev-dependencies]
criterion = "0.4"
proptest = "1.0"

[[bench]]
name = "tick_benchmark"
harness = false
