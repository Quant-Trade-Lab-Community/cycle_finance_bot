apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: cycle-finance-dns-failure
  namespace: default
spec:
  action: error
  mode: all
  selector:
    labelSelectors:
      app: cycle-finance
  patterns:
    - api.binance.com
    - stream.binance.com
  duration: '5m'
  scheduler:
    cron: '@every 30m'
