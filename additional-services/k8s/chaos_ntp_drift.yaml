apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: demir-yumruk-ntp-drift
  namespace: default
spec:
  mode: all
  selector:
    labelSelectors:
      app: demir-yumruk
  timeOffset: '10s' # Simulate NTP drift of 10 seconds ahead
  duration: '5m'
  scheduler:
    cron: '@every 15m'
