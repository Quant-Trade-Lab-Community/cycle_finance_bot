apiVersion: apps/v1
kind: Deployment
metadata:
  name: cycle-finance-core
  labels:
    app: cycle-finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cycle-finance
  template:
    metadata:
      labels:
        app: cycle-finance
      annotations:
        # Require cgroups v2 resource management
        kubernetes.io/cgroup-version: "v2"
    spec:
      containers:
      - name: core
        image: cycle-finance/core:latest
        resources:
          limits:
            cpu: "4"
            memory: "4Gi"
          requests:
            cpu: "4"
            memory: "4Gi"
        securityContext:
          capabilities:
            add:
              - SYS_NICE # Required for SCHED_FIFO real-time thread scheduling
        env:
          - name: RUST_LOG
            value: "info"
