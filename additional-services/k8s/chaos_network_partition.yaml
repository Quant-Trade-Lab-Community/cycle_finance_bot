apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: cycle-finance-network-partition
  namespace: default
spec:
  action: partition
  mode: all
  selector:
    labelSelectors:
      app: cycle-finance
  direction: both
  target:
    selector:
      labelSelectors:
        app: redis-cluster
    mode: all
  duration: '10s'
  scheduler:
    cron: '@every 5m'
