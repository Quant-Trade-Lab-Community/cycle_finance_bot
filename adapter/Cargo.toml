[package]
name = "adapter"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }
flume = "0.11"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"

[dev-dependencies]
testcontainers = "0.14"
wiremock = "0.5"
