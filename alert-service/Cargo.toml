[package]
name = "alert-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
core = { path = "../core" }
rust_decimal = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1.0"
flume = "0.11"
clap = { version = "4.6", features = ["derive"] }

[[bin]]
name = "alert-service"
path = "src/main.rs"
